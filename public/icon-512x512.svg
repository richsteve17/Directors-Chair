<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  
  <!-- Phoenix -->
  <g transform="translate(256, 140)">
    <!-- Phoenix body -->
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="#d4a574"/>
    
    <!-- Phoenix head -->
    <circle cx="0" cy="-55" r="28" fill="#d4a574"/>
    
    <!-- Left wing -->
    <path d="M -20 -10 Q -95 -55 -85 15 Q -75 30 -25 15" fill="#d4a574" stroke="#b8860b" stroke-width="2"/>
    
    <!-- Right wing -->
    <path d="M 20 -10 Q 95 -55 85 15 Q 75 30 25 15" fill="#d4a574" stroke="#b8860b" stroke-width="2"/>
    
    <!-- Wing highlights (flames) -->
    <path d="M -70 -25 Q -80 -45 -60 -35" fill="#ffa500" stroke="#ff6347" stroke-width="2"/>
    <path d="M 70 -25 Q 80 -45 60 -35" fill="#ffa500" stroke="#ff6347" stroke-width="2"/>
    <path d="M -50 -45 Q -65 -60 -45 -50" fill="#ffa500" stroke="#ff6347" stroke-width="1.5"/>
    <path d="M 50 -45 Q 65 -60 45 -50" fill="#ffa500" stroke="#ff6347" stroke-width="1.5"/>
  </g>
  
  <!-- Director's Chair X-frame -->
  <g transform="translate(256, 300)">
    <!-- Left leg -->
    <line x1="-55" y1="-40" x2="-22" y2="45" stroke="#8b7355" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Right leg -->
    <line x1="55" y1="-40" x2="22" y2="45" stroke="#8b7355" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Seat -->
    <rect x="-50" y="-20" width="100" height="35" fill="#2a2a2a" stroke="#d4a574" stroke-width="2"/>
    
    <!-- Brass accents on frame -->
    <circle cx="-55" cy="-40" r="6" fill="#d4a574"/>
    <circle cx="55" cy="-40" r="6" fill="#d4a574"/>
  </g>
</svg>
